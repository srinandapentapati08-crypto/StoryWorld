<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
        var l = window.location;
        var repo = "/storyworld";
        var newUrl =
          repo +
          "/?/" +
          l.pathname.replace(repo, "").replace(/^\/+/, "") +
          l.search +
          l.hash;

        window.location.replace(newUrl);
    </script>
</head>
<body></body>
</html>
